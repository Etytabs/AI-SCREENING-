name: Retrieval Benchmark

on:
  workflow_dispatch:

jobs:
  model-backed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[ml]"
      - name: Run model-backed retrieval benchmark
        env:
          AI_SCREENING_EMBEDDINGS_ENABLED: "true"
          AI_SCREENING_EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
        run: python -m scripts.evaluate_retrieval --output data/evaluation/retrieval_results.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark-results
          path: data/evaluation/retrieval_results.json
