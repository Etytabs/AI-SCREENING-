[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-screening"
version = "0.1.0"
description = "AI/ML-centered research intelligence platform for grant screening and publication reconciliation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "pymupdf>=1.25,<2.0",
  "python-docx>=1.1,<2.0",
  "google-genai>=1.0,<2.0",
]

[project.optional-dependencies]
ml = ["numpy>=2.0,<3.0", "scikit-learn>=1.6,<2.0", "sentence-transformers>=3.3,<6.0"]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
include = ["apps*", "ml*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I"]
lint.ignore = ["E501"]
